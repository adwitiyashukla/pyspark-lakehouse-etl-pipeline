[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spillway"
version = "0.1.0"
description = "Spark batch and streaming ETL over NYC taxi and for-hire trip records"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.6",
    "pyarrow>=15.0.0",
    "pyiceberg[sql-sqlite]>=0.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
spillway = "spillway.cli:main"

[tool.setuptools.packages.find]
include = ["spillway*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
