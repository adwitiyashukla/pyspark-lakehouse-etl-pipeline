name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ingest
        run: python -m lakeetl.cli --config config.ci.toml ingest
      - name: Bronze
        run: python -m lakeetl.cli --config config.ci.toml bronze
      - name: Silver
        run: python -m lakeetl.cli --config config.ci.toml silver
      - name: Gold
        run: python -m lakeetl.cli --config config.ci.toml gold
      - name: Quality gate
        run: python -m lakeetl.cli --config config.ci.toml quality
      - name: Iceberg
        run: python -m lakeetl.cli --config config.ci.toml iceberg
      - name: Streaming
        run: |
          python -m lakeetl.cli --config config.ci.toml stream-produce
          python -m lakeetl.cli --config config.ci.toml stream-run --reset
      - name: Tuning lab
        run: python -m lakeetl.cli --config config.ci.toml tune
      - name: Rerun is a no op
        run: |
          python -m lakeetl.cli --config config.ci.toml bronze
          python -m lakeetl.cli --config config.ci.toml report
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: data-ci/reports/

  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m venv .airflow-venv
          .airflow-venv/bin/pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.11.txt"
        env:
          AIRFLOW_VERSION: "2.10.5"
      - name: Run the DAG
        run: |
          export AIRFLOW_HOME="${GITHUB_WORKSPACE}/.airflow"
          export AIRFLOW__CORE__DAGS_FOLDER="${GITHUB_WORKSPACE}/airflow/dags"
          export AIRFLOW__CORE__LOAD_EXAMPLES=False
          export LAKEETL_HOME="${GITHUB_WORKSPACE}"
          export LAKEETL_CONFIG=config.ci.toml
          export LAKEETL_PYTHON="$(which python)"
          .airflow-venv/bin/airflow db migrate
          .airflow-venv/bin/airflow dags test lakeetl_pipeline 2024-01-01
      - uses: actions/upload-artifact@v4
        with:
          name: airflow-report
          path: data-ci/reports/
